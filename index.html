<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <form action="">
        <div>
            <label for="location-input">Location</label>
            <input type="search" id="location-input" required>
        </div>
        <button>Search</button>
    </form>
    <div>
        <input type="radio" name="temp-unit" id="farenheit" value="farenheit" checked>
        <label for="farenheit">°F</label>
        <input type="radio" name="temp-unit" value="celsius" id="celsius">
        <label for="celsius">°C</label>
        <input type="radio" name="temp-unit" value="kelvin" id="kelvin">
        <label for="kelvin">K</label>
    </div>
    
    <div id="weather-forecast">
        <figure>
            <img id="weather-icon" src="" alt="">
            <figcaption id="weather-icon-caption"></figcaption>
        </figure>
        <p id="location-display"></p>
        <p id="temp-display"></p>
        <p id="temp-range-display"></p>
    </div>
    <script src="DOMController.js" type="module"></script>
</body>
</html>

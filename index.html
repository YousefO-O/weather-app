<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <form action="">
        <div>
            <label for="location-input">Location</label>
            <input type="search" id="location-input" required>
        </div>
        <button>Search</button>
    </form>
    
    
    <div id="weather-forecast">
        <div class="top left">
            <img id="weather-icon" class="left" src="" alt="">
            <div class="right">
                <p id="location-display" class="top right"></p>
                <div class="bottom">
                    <p id="temp-display"></p>
                    <div id="temp-units">
                        <div>
                            <input type="radio" name="temp-unit" id="farenheit" value="farenheit" checked>
                            <label for="farenheit">°F</label>
                        </div>
                        <div>
                            <input type="radio" name="temp-unit" value="celsius" id="celsius">
                            <label for="celsius">°C</label>
                        </div>
                        <div>
                            <input type="radio" name="temp-unit" value="kelvin" id="kelvin">
                            <label for="kelvin">K</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="top right">
            <p id="conditions" class="top right"></p>       
            <p id="temp-range-display" class="top right"></p>
        </div>
        <div id="hours-slider">
        </div>
    </div>
    <div id="loading-component">
        <p id="fetching-status">Fetching data</p>
    </div>
    <script src="DOMController.js" type="module"></script>
</body>
</html>
